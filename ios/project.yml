name: CourtVision
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  CourtVision:
    type: application
    platform: iOS
    sources: [CourtVision]
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.courtvision.app
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: X7U33S22NA   # automatic signing for device builds (xcodegen regenerates the project)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO   # TestFlight: no export-compliance prompt
        INFOPLIST_KEY_NSCameraUsageDescription: "CourtVision analyzes your shot using the camera."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait app; the camera screens force landscape-right at runtime
        # (OrientationLock) — one fixed orientation while calibrating and
        # recording keeps the preview↔buffer transform stable, and a game
        # court needs the wide axis.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        SUPPORTS_MACCATALYST: YES                # macOS via Mac Catalyst (same target)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    scheme:
      testTargets: [CourtVisionTests]
  CourtVisionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CourtVisionTests
        excludes: ["Fixtures/**"]
      - path: CourtVisionTests/Fixtures
        buildPhase: resources     # files land at the test bundle root
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.courtvision.app.tests
        SUPPORTS_MACCATALYST: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: CourtVision
