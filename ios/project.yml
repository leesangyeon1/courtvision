name: CourtVision
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  CourtVision:
    type: application
    platform: iOS
    sources: [CourtVision]
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.courtvision.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "CourtVision analyzes your shot using the camera."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait-only: the preview↔buffer coordinate transform must not
        # change between calibration and recording.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    scheme:
      testTargets: [CourtVisionTests]
  CourtVisionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CourtVisionTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.courtvision.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: CourtVision
